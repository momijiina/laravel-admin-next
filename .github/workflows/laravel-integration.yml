name: Real Laravel integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    # Full-suite jobs across PHP versions approach or exhaust 30 minutes.
    # See tests/integration/README.md for measured runtimes and limits.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.4'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.5'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            testbench: '^11.0'
            phpunit: '^12.0'
          - php: '8.4'
            testbench: '^11.0'
            phpunit: '^12.0'
          - php: '8.5'
            testbench: '^11.0'
            phpunit: '^12.0'
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, gd
          coverage: none
          tools: composer:v2
      - name: Resolve isolated consumer dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with 'orchestra/testbench:${{ matrix.testbench }}' --with 'phpunit/phpunit:${{ matrix.phpunit }}'
      - name: Check actual runtime requirements
        run: composer check-platform-reqs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned collection DOM test dependencies
        run: npm ci --ignore-scripts --prefix javascript
      - name: Run real Laravel lifecycle tests
        # For V8 coverage runs, set NODE_DISABLE_COMPILE_CACHE=1.
        run: |
          NODE_COMPILE_CACHE="$(mktemp -d "${RUNNER_TEMP}/node-compile-cache.XXXXXX")"
          export NODE_COMPILE_CACHE
          composer test
