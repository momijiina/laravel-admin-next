name: Real Laravel integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.4'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.5'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            testbench: '^11.0'
            phpunit: '^12.0'
          - php: '8.4'
            testbench: '^11.0'
            phpunit: '^12.0'
          - php: '8.5'
            testbench: '^11.0'
            phpunit: '^12.0'
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Resolve isolated consumer dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with 'orchestra/testbench:${{ matrix.testbench }}' --with 'phpunit/phpunit:${{ matrix.phpunit }}'
      - name: Check actual runtime requirements
        run: composer check-platform-reqs
      - name: Check JavaScript asset test runtime
        run: node --version
      - name: Run real Laravel lifecycle tests
        run: composer test
