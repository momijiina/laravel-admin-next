name: Generated default literals

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  default-literals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint generator and regression
        run: |
          php -l src/Console/ResourceGenerator.php
          php -l tests/compatibility/generated_default_literals.php
      - name: Parse and evaluate generated defaults (not the full Laravel suite)
        run: php tests/compatibility/generated_default_literals.php
