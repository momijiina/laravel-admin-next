name: Operation log redaction regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['7.0', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check focused files
        run: |
          php -l src/Middleware/LogOperation.php
          php -l config/admin.php
          php -l tests/compatibility/operation_log_redaction.php
      - name: Run standalone regression (not the full Laravel suite)
        run: php tests/compatibility/operation_log_redaction.php
